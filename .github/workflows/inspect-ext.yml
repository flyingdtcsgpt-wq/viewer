# 임시: VS Code 확장(Claude Code · Codex)이 밖에서 글을 받는 길(URI · 명령)을 확인하려고 소스를 훑어본다. 확인 뒤 지운다.
name: inspect-ext
on:
  push:
    paths: ['.github/workflows/inspect-ext.yml']
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download
        run: |
          set +e
          get() { # publisher name out
            curl -sSL --compressed -o "$3" "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$1/vsextensions/$2/latest/vspackage?targetPlatform=win32-x64"
            unzip -tq "$3" >/dev/null 2>&1 || curl -sSL --compressed -o "$3" "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/$1/vsextensions/$2/latest/vspackage"
            unzip -tq "$3" >/dev/null 2>&1 || { u=$(curl -sS "https://open-vsx.org/api/$1/$2" | jq -r '.files.download'); echo "openvsx: $u"; curl -sSL -o "$3" "$u"; }
            ls -la "$3"; mkdir -p "x-$2"; unzip -q -o "$3" -d "x-$2"; }
          get anthropic claude-code claude.vsix
          get openai chatgpt codex.vsix
          for d in x-claude-code x-chatgpt; do echo "== $d"; jq -r '.name+" "+.version' $d/extension/package.json; (cd $d/extension && find . -maxdepth 2 -size +200k -printf '%s %p\n' | sort -rn | head -12); done
      - name: Claude createPanel
        run: |
          cd x-claude-code/extension
          E=extension.js; W=webview/index.js
          echo "--- createPanel def"; grep -o '.\{60\}async createPanel(.\{5200\}' $E | head -c 16000; echo
          echo "--- requestInputFocus calls"; grep -o '.\{500\}requestInputFocus(.\{300\}' $E | head -c 9000; echo
          echo "--- hasPanelForSession"; grep -o '.\{80\}hasPanelForSession(.\{500\}' $E | head -c 3000; echo
          echo "--- notifyActivateSession calls"; grep -o '.\{600\}notifyActivateSession(.\{400\}' $E | head -c 8000; echo
          echo "--- webview consumeInputFocusRequest"; grep -o '.\{300\}consumeInputFocusRequest().\{500\}' $W | head -c 4000; echo
          echo "--- webview ambientFocusAllowed"; grep -o '.\{400\}ambientFocusAllowed().\{400\}' $W | head -c 5000; echo
          echo "--- webview activateSessionEvents"; grep -o '.\{200\}activateSessionEvents\.\(on\|subscribe\|add\)[a-zA-Z]*(.\{900\}' $W | head -c 5000; echo
          echo "--- confirm uri"; grep -o '.\{100\}confirmedUriHandlerExtensionIds.\{200\}' $E | head -c 1000; echo
