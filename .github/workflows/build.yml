name: Build

# main 에 push 하면 빌드해서 Actions 탭 "Artifacts" 에 올림
# v0.2.0 처럼 태그를 push 하면 Releases 페이지에 설치파일을 게시
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=windows --org com.mediashelf --project-name media_shelf .

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_windows.yaml

      - name: Analyze (오류만 실패 처리)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\media_shelf.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\MediaShelf-$ver-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-windows
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.mediashelf --project-name media_shelf .

      - name: Android permissions
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_android.yaml

      # 저장소 Secrets 에 서명 키가 있으면 정식 키로 서명 (없으면 임시 debug 키)
      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.p12
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.p12\n' "$PW" "$PW" "${ALIAS:-mediashelf}" > android/key.properties
            echo "정식 키로 서명합니다"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 Secret 이 없어 임시(debug) 키로 서명합니다"
          fi

      # 기종별로 나눠 빌드 (하나에 다 넣으면 128MB)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect
        run: |
          mkdir -p dist
          ver=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml)
          ls -la build/app/outputs/flutter-apk/
          # 요즘 폰(갤럭시 S/노트/A 대부분): arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/MediaShelf-$ver-android.apk
          # 아주 오래된 32비트 폰용
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/MediaShelf-$ver-android-old32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: MediaShelf-android
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
