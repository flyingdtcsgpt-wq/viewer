name: Build

# main 에 push 하면 빌드해서 Actions 탭 "Artifacts" 에 올림
# v0.2.0 처럼 태그를 push 하면 Releases 페이지에 설치파일을 게시
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=windows --org com.mediashelf --project-name media_shelf .

      - name: Windows window title / size
        run: python tool/patch_windows.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_windows.yaml

      - name: Analyze (오류만 실패 처리)
        run: flutter analyze --no-fatal-infos --no-fatal-warnings lib test

      - name: Test
        run: flutter test

      - name: Build Windows
        run: flutter build windows --release

      # 오프라인 PC 에서도 되도록: 7-Zip(RAR/7Z), VC++ 런타임, 라이선스 고지를 함께 넣는다
      - name: Bundle 7-Zip, VC++ runtime, notices
        shell: pwsh
        run: |
          $rel = "build\windows\x64\runner\Release"
          New-Item -ItemType Directory -Force "$rel\tools\7zip" | Out-Null
          # 빌드 머신에 깔린 7-Zip 을 가져온다 (없으면 choco 로 설치)
          $sz = "$env:ProgramFiles\7-Zip"
          if (-not (Test-Path "$sz\7z.dll")) { choco install 7zip -y --no-progress | Out-Null }
          Copy-Item "$sz\7z.exe", "$sz\7z.dll", "$sz\License.txt" "$rel\tools\7zip\"
          foreach ($d in 'msvcp140.dll', 'vcruntime140.dll', 'vcruntime140_1.dll') {
            Copy-Item "$env:WINDIR\System32\$d" $rel -ErrorAction SilentlyContinue
          }
          Copy-Item THIRD_PARTY_NOTICES.txt $rel
          Get-ChildItem -Recurse "$rel\tools" | Select-Object FullName, Length

      - name: Install Inno Setup if missing
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }

      - name: Build installer
        shell: pwsh
        run: |
          $ver = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" installer\media_shelf.iss
          # 포터블 zip: 옆에 arariflex_data 폴더가 있어 압축만 풀면 휴대용 모드 (USB 로 통째로 옮기기)
          $stage = "$env:RUNNER_TEMP\ARARIFlex"
          Copy-Item -Recurse build\windows\x64\runner\Release $stage
          New-Item -ItemType Directory -Force "$stage\arariflex_data" | Out-Null
          Set-Content -Encoding utf8 "$stage\arariflex_data\README.txt" "이 폴더가 있으면 ARARIFlex 가 라이브러리 · 설정 · 표지 · 음성/글자 인식 모델을 모두 여기에 저장합니다.`r`nARARIFlex 폴더를 통째로 USB 에 담아 다른 PC 로 옮기면 인터넷 없이 그대로 쓸 수 있습니다.`r`n이 폴더를 지우면 일반 모드(%APPDATA%)로 돌아갑니다."
          Compress-Archive -Path "$stage" -DestinationPath dist\ARARIFlex-$ver-windows-portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ARARIFlex-windows
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # 주요 화면을 실제 Windows 앱으로 띄워 PNG 로 저장 (UI 확인용)
  screenshots:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=windows --org com.mediashelf --project-name media_shelf .

      - name: Windows window title / size
        run: python tool/patch_windows.py

      - run: flutter pub get

      - name: Analyze screenshot test
        run: flutter analyze --no-fatal-infos --no-fatal-warnings integration_test test_driver

      - name: Capture screens
        shell: pwsh
        env:
          SHOTS_DIR: ${{ github.workspace }}\screenshots
          TTS_CHECK: '1'
        run: flutter test integration_test/screenshots_test.dart -d windows

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARARIFlex-screenshots
          path: |
            screenshots/*.png
            screenshots/*.wav

      # 브라우저로 바로 보도록 screenshots 브랜치에 올린다 (README 에 전부 나열)
      - name: Publish to screenshots branch
        if: always() && github.event_name == 'push'
        shell: pwsh
        run: |
          if (-not (Test-Path screenshots)) { exit 0 }
          cd screenshots
          $md = "# ARARIFlex 화면 캡처`n`n커밋 ${{ github.sha }}`n`n"
          foreach ($f in Get-ChildItem *.wav | Sort-Object Name) {
            $u = [uri]::EscapeDataString($f.Name)
            $md += "- 음성 샘플: [$($f.Name)]($u)`n"
          }
          $md += "`n"
          foreach ($f in Get-ChildItem *.png | Sort-Object Name) {
            $u = [uri]::EscapeDataString($f.Name)
            $md += "## $($f.BaseName)`n`n![]($u)`n`n"
          }
          Set-Content -Encoding utf8 README.md $md
          git init -q
          git checkout -q -b screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Screenshots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots

  android:
    # 안드로이드 다듬는 중: push 마다 빌드 (APK 는 Artifact 로)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.mediashelf --project-name media_shelf .

      - name: Android permissions
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_android.yaml

      # 저장소 Secrets 에 서명 키가 있으면 정식 키로 서명 (없으면 임시 debug 키)
      - name: Release signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > android/app/release.p12
            printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=release.p12\n' "$PW" "$PW" "${ALIAS:-mediashelf}" > android/key.properties
            echo "정식 키로 서명합니다"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 Secret 이 없어 임시(debug) 키로 서명합니다"
          fi

      # 기종별로 나눠 빌드 (하나에 다 넣으면 128MB)
      - name: Build APK
        run: flutter build apk --release --split-per-abi

      - name: Collect
        run: |
          mkdir -p dist
          ver=$(grep -oP '^version:\s*\K[0-9.]+' pubspec.yaml)
          ls -la build/app/outputs/flutter-apk/
          # 요즘 폰(갤럭시 S/노트/A 대부분): arm64
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/ARARIFlex-$ver-android.apk
          # 아주 오래된 32비트 폰용
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/ARARIFlex-$ver-android-old32bit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: ARARIFlex-android
          path: dist/*

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*

  # 안드로이드 에뮬레이터에서 실제 앱 화면 캡처 + 자연 음성 · 글자 인식(ML Kit) 검사
  android-screens:
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=android --org com.mediashelf --project-name media_shelf .

      - name: Android patches
        run: python3 tool/patch_android.py

      - run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disk-size: 8000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d emulator-5554 --dart-define=TTS_CHECK=true 2>&1 | tee android-test.log || true
            ls -la shots-android/shots || true

      - name: Show checks
        if: always()
        run: grep -E "CHECK|SHOT|STEP FAILED|EXCEPTION|Error|error:|tests passed|failed" android-test.log | head -80 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ARARIFlex-android-screenshots
          path: |
            shots-android/shots/*
            android-test.log

      - name: Publish to screenshots-android branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots-android/shots ] || exit 0
          cd shots-android/shots
          {
            echo "# ARARIFlex 안드로이드 화면 (에뮬레이터)"
            echo
            echo "커밋 ${{ github.sha }}"
            echo
            for f in *.wav; do [ -e "$f" ] && echo "- 음성 샘플: [$f]($(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f"))"; done
            echo
            for f in $(ls *.png | sort); do echo "## ${f%.png}"; echo; echo "![]($(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f"))"; echo; done
          } > README.md
          git init -q
          git checkout -q -b screenshots-android
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Android screenshots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-android

  # ---------------- macOS (맥북 · 아이맥) ----------------
  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=macos --org com.mediashelf --project-name media_shelf .

      - run: flutter pub get

      - name: macOS patches
        run: python3 tool/patch_apple.py macos

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_macos.yaml

      - name: Build
        run: flutter build macos --release

      - name: Package
        run: |
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          app=$(ls -d build/macos/Build/Products/Release/*.app | head -1)
          echo "app: $app"
          mkdir -p dist
          cp THIRD_PARTY_NOTICES.txt "$app/Contents/Resources/" || true
          ditto -c -k --keepParent "$app" "dist/ARARIFlex-$ver-macos.zip"
          hdiutil create -volname ARARIFlex -srcfolder "$app" -ov -format UDZO "dist/ARARIFlex-$ver-macos.dmg"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ARARIFlex-macos
          path: dist/*

      - name: Capture screens (macOS)
        continue-on-error: true
        env:
          SHOTS_DIR: ${{ github.workspace }}/shots-macos
          TTS_CHECK: '1'
        run: flutter test integration_test/screenshots_test.dart -d macos 2>&1 | tee macos-test.log

      - name: Show checks
        if: always()
        run: grep -E "CHECK|STEP FAILED|EXCEPTION|error:|tests passed|failed" macos-test.log | head -60 || true

      - name: Publish to screenshots-macos branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots-macos ] || exit 0
          cd shots-macos
          {
            echo "# ARARIFlex macOS 화면"; echo; echo "커밋 ${{ github.sha }}"; echo
            for f in $(ls *.png | sort); do echo "## ${f%.png}"; echo; echo "![]($(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f"))"; echo; done
          } > README.md
          git init -q && git checkout -q -b screenshots-macos
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "macOS screenshots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-macos

  # ---------------- iOS (아이폰 · 아이패드) ----------------
  ios:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate platform folders
        run: flutter create --platforms=ios --org com.mediashelf --project-name media_shelf .

      - run: flutter pub get

      - name: iOS patches
        run: python3 tool/patch_apple.py ios

      - name: App icon
        run: dart run flutter_launcher_icons -f tool/icons_ios.yaml

      # 서명 없이 빌드 → 사용자가 Sideloadly · AltStore 로 자기 Apple ID 로 서명해 설치
      - name: Build (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        run: |
          ver=$(grep -E '^version:' pubspec.yaml | sed -E 's/version: *([0-9.]+).*/\1/')
          mkdir -p dist Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry "dist/ARARIFlex-$ver-ios-unsigned.ipa" Payload
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: ARARIFlex-ios
          path: dist/*

      # 시뮬레이터에서 실제 앱 화면 (아이폰 · 아이패드)
      - name: Capture on simulators
        continue-on-error: true
        run: |
          mkdir -p shots-ios
          for kind in iPhone iPad; do
            udid=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[x for k,v in d.items() if 'iOS' in k for x in v if x['name'].startswith('$kind')]
          print(c[-1]['udid'] if c else '')")
            [ -n "$udid" ] || { echo "no $kind simulator"; continue; }
            echo "== $kind $udid"
            xcrun simctl boot "$udid" || true
            xcrun simctl bootstatus "$udid" -b || true
            flutter drive --driver=test_driver/integration_test.dart --target=integration_test/screenshots_test.dart -d "$udid" --dart-define=TTS_CHECK=true 2>&1 | tee "ios-$kind.log" || true
            mkdir -p "shots-ios/$kind"
            [ -d shots-android/shots ] && mv shots-android/shots/* "shots-ios/$kind/" || true
            xcrun simctl shutdown "$udid" || true
          done

      - name: Show checks
        if: always()
        run: grep -hE "CHECK|STEP FAILED|EXCEPTION|DRIVER|error:|tests passed|Some tests failed" ios-*.log | head -80 || true

      - name: Publish to screenshots-ios branch
        if: always() && github.event_name == 'push'
        run: |
          [ -d shots-ios ] || exit 0
          cd shots-ios
          {
            echo "# ARARIFlex iPhone · iPad 화면 (시뮬레이터)"; echo; echo "커밋 ${{ github.sha }}"; echo
            for d in iPhone iPad; do
              [ -d "$d" ] || continue
              echo "# $d"; echo
              for f in $(ls "$d" | grep png | sort); do echo "## $d ${f%.png}"; echo; echo "![]($d/$(python3 -c 'import sys,urllib.parse;print(urllib.parse.quote(sys.argv[1]))' "$f"))"; echo; done
            done
          } > README.md
          git init -q && git checkout -q -b screenshots-ios
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -qm "iOS screenshots for ${{ github.sha }}"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" screenshots-ios
