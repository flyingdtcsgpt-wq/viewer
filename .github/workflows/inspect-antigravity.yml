# 임시: 진짜 Antigravity IDE 의 에이전트 화면이 Agent Chat 의 전달 문(프록시)을 거쳐서도 뜨는지 본다. 확인 뒤 지운다.
name: inspect-antigravity
on:
  push:
    paths: ['.github/workflows/inspect-antigravity.yml']
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and launch Antigravity IDE
        run: |
          $ErrorActionPreference = 'Continue'
          winget install -e --id Google.AntigravityIDE --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 1
          $exe = "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe"
          $work = Join-Path $env:RUNNER_TEMP 'ag-work'; New-Item -ItemType Directory -Force $work | Out-Null; 'hello' | Out-File (Join-Path $work 'hello.txt')
          $env:ELECTRON_RUN_AS_NODE = $null
          Start-Process -FilePath $exe -ArgumentList @('--user-data-dir', (Join-Path $env:RUNNER_TEMP 'ag-data'), '--disable-workspace-trust', $work)
          $d = Join-Path $env:USERPROFILE '.gemini\antigravity\daemon'
          for ($i = 0; $i -lt 120; $i++) { if (Test-Path "$d\hub_*.json") { break }; Start-Sleep 1 }
          Start-Sleep 8
          foreach ($f in Get-ChildItem "$d\*.json") { "== $($f.Name)"; [regex]::Replace((Get-Content -Raw $f.FullName), '([A-Za-z0-9+/_=-]{6})[A-Za-z0-9+/_=-]{18,}', '$1...') }
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^agy' } | ForEach-Object { "agy: " + [regex]::Replace($_.CommandLine, '([A-Za-z0-9+/_-]{8})[A-Za-z0-9+/_-]{20,}', '$1...') }
      - name: Agent Chat server and proxy
        run: |
          $ErrorActionPreference = 'Continue'
          $home2 = Join-Path $env:RUNNER_TEMP 'ac-home'; New-Item -ItemType Directory -Force $home2 | Out-Null
          '{"token":"ci-token-1234567890abcdef","port":8790,"host":"127.0.0.1"}' | Out-File -Encoding ascii (Join-Path $home2 'config.json')
          $env:AGENT_CHAT_HOME = $home2; $env:AGENT_CHAT_AG_LOG = '1'
          $log = Join-Path $env:RUNNER_TEMP 'ac.log'
          Start-Process -FilePath node -ArgumentList 'agent-chat\server.js' -RedirectStandardOutput $log -RedirectStandardError (Join-Path $env:RUNNER_TEMP 'ac.err') -WindowStyle Hidden
          Start-Sleep 3
          $h = @{ Authorization = 'Bearer ci-token-1234567890abcdef' }
          $hubs = Invoke-RestMethod http://127.0.0.1:8790/api/antigravity -Headers $h
          "hubs: $($hubs | ConvertTo-Json -Compress -Depth 5)"
          $chrome = "$env:ProgramFiles\Google\Chrome\Application\chrome.exe"
          foreach ($q in '/', '/?extensionView=true&useWebSocket=true') {
            $open = Invoke-RestMethod http://127.0.0.1:8790/api/antigravity/open -Method Post -Headers $h -ContentType 'application/json' -Body '{}'
            # 로그인 주소로 들어가 쿠키를 받고, 그 화면을 그려 본다 (머리 없는 크롬)
            $u = $open.url
            "== through the proxy: $q   ($($u -replace 'k=.*', 'k=...'))"
            $prof = Join-Path $env:RUNNER_TEMP ("chrome-" + [guid]::NewGuid().ToString('n'))
            & $chrome --headless=new --disable-gpu --no-first-run --user-data-dir=$prof --virtual-time-budget=4000 --dump-dom $u 2>$null | Out-Null
            $base = ($u -split '/__ac/')[0]
            $dom = & $chrome --headless=new --disable-gpu --no-first-run --user-data-dir=$prof --virtual-time-budget=25000 --dump-dom ($base + $q) 2>$null | Out-String
            "dom length: $($dom.Length)"
            ($dom -replace '<script[\s\S]*?</script>', '' -replace '<style[\s\S]*?</style>', '' -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim().Substring(0, [Math]::Min(900, ($dom -replace '<script[\s\S]*?</script>', '' -replace '<style[\s\S]*?</style>', '' -replace '<[^>]+>', ' ' -replace '\s+', ' ').Trim().Length))
          }
          "== proxy log (what the page asked the hub for)"
          Get-Content $log | Where-Object { $_ -match 'antigravity' } | Group-Object | Sort-Object Count -Descending | ForEach-Object { "$($_.Count)x $($_.Name)" } | Select-Object -First 80
          "== server stderr"; Get-Content (Join-Path $env:RUNNER_TEMP 'ac.err') -ErrorAction SilentlyContinue | Select-Object -First 20
