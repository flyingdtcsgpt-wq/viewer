# 임시: Antigravity IDE 의 에이전트가 어떻게 돌아가는지(로컬 허브 · agy CLI · 대화 저장) 훑어본다. 확인 뒤 지운다.
name: inspect-antigravity
on:
  push:
    paths: ['.github/workflows/inspect-antigravity.yml']
jobs:
  inspect:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install and launch
        run: |
          $ErrorActionPreference = 'Continue'
          foreach ($id in 'Google.AntigravityIDE', 'Google.AntigravityCLI') { winget install -e --id $id --silent --accept-package-agreements --accept-source-agreements --disable-interactivity 2>&1 | Select-Object -Last 1 }
          $exe = "$env:LOCALAPPDATA\Programs\Antigravity IDE\Antigravity IDE.exe"
          $work = Join-Path $env:RUNNER_TEMP 'ag-work'; New-Item -ItemType Directory -Force $work | Out-Null; 'hello' | Out-File (Join-Path $work 'hello.txt')
          $env:ELECTRON_RUN_AS_NODE = $null
          Start-Process -FilePath $exe -ArgumentList @('--remote-debugging-port=9333', '--user-data-dir', (Join-Path $env:RUNNER_TEMP 'ag-data'), '--disable-workspace-trust', $work)
          $d = Join-Path $env:USERPROFILE '.gemini\antigravity\daemon'
          for ($i = 0; $i -lt 90; $i++) { if (Test-Path "$d\hub_*.json") { break }; Start-Sleep 1 }
          Start-Sleep 8
          Get-ChildItem $d -ErrorAction SilentlyContinue | ForEach-Object { $_.Name }
      - name: Processes and small files
        run: |
          $ErrorActionPreference = 'Continue'
          $red = { param($s) [regex]::Replace([string]$s, '([A-Za-z0-9+/_=-]{6})[A-Za-z0-9+/_=-]{18,}', '$1...') }
          "== agy processes"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^agy' } | ForEach-Object { "pid $($_.ProcessId) parent $($_.ParentProcessId): " + (& $red $_.CommandLine) }
          "== parent of agy"
          Get-CimInstance Win32_Process | Where-Object { $_.Name -match '^agy' } | ForEach-Object { $pp = Get-CimInstance Win32_Process -Filter "ProcessId=$($_.ParentProcessId)"; "$($pp.Name): " + (& $red $pp.CommandLine).Substring(0, [Math]::Min(300, (& $red $pp.CommandLine).Length)) }
          $g = Join-Path $env:USERPROFILE '.gemini'
          foreach ($f in (Get-ChildItem "$g\antigravity\daemon\*.json") + @(Get-Item "$g\antigravity\antigravity_state.pbtxt", "$g\config\config.json", "$g\bin\agy.version.json" -ErrorAction SilentlyContinue)) { "== $($f.FullName.Substring($g.Length))"; & $red (Get-Content -Raw $f.FullName) }
          "== conversation_summaries.db schema"
          python -c "import sqlite3,sys; c=sqlite3.connect(sys.argv[1]); [print(r[0]) for r in c.execute('select sql from sqlite_master where sql is not null')]" "$g\antigravity\conversation_summaries.db"
          "== conversations / brain"; Get-ChildItem "$g\antigravity\conversations", "$g\antigravity\brain", "$g\config\projects" -Recurse -ErrorAction SilentlyContinue | ForEach-Object { "$($_.FullName.Substring($g.Length)) $($_.Length)" } | Select-Object -First 30
      - name: Hub web app
        run: |
          @'
          const fs = require('fs'), os = require('os'), path = require('path'), http = require('http');
          const dir = path.join(os.homedir(), '.gemini', 'antigravity', 'daemon');
          const port = (fs.readdirSync(dir).map(f => f.match(/^hub_(\d+)\.json$/)).find(Boolean) || [])[1];
          const req = (p, headers = {}, method = 'GET', body) => new Promise(res => { const r = http.request({ host: '127.0.0.1', port, path: p, method, headers }, x => { let b = ''; x.setEncoding('utf8'); x.on('data', d => b += d); x.on('end', () => res({ status: x.statusCode, headers: x.headers, body: b })); }); r.on('error', e => res({ status: 0, headers: {}, body: String(e) })); if (body) r.write(body); r.end(); });
          const uniq = a => [...new Set(a)];
          (async () => {
            console.log('hub port', port);
            const page = await req('/?extensionView=true&useWebSocket=true');
            console.log('GET / ->', page.status, JSON.stringify(page.headers).slice(0, 700));
            console.log(page.body.slice(0, 1500));
            for (const [name, h] of [['other Host', { Host: '100.64.0.9:8791' }], ['other Origin', { Origin: 'http://100.64.0.9:8791' }], ['no headers', {}]]) console.log('GET / with', name, '->', (await req('/', h)).status);
            const srcs = uniq([...page.body.matchAll(/(?:src|href)="([^"]+\.(?:js|mjs))"/g)].map(m => m[1]));
            console.log('scripts', srcs);
            let all = '';
            for (const s of srcs) { const r = await req(s.startsWith('/') ? s : '/' + s); console.log(' ', s, r.status, r.body.length); all += '\n' + r.body; }
            // 더 불러오는 조각들
            const chunks = uniq([...all.matchAll(/["'`]((?:\.\/|\/)?assets\/[A-Za-z0-9_.-]+\.js)["'`]/g)].map(m => m[1])).slice(0, 80);
            console.log('chunks', chunks.length);
            for (const s of chunks) { const r = await req('/' + s.replace(/^\.?\//, '')); if (r.status === 200) all += '\n' + r.body; }
            console.log('total js', all.length);
            const rpc = uniq([...all.matchAll(/[a-z][A-Za-z0-9_.]*\.[A-Z][A-Za-z]*Service\/?[A-Za-z]*/g)].map(m => m[0])); console.log('services', rpc.slice(0, 60));
            const paths = uniq([...all.matchAll(/["'`](\/(?:api|v\d|rpc|ws|hub|connect)[A-Za-z0-9_\/.:-]*)["'`]/g)].map(m => m[1])); console.log('paths', paths.slice(0, 150));
            const methods = uniq([...all.matchAll(/name:"([A-Z][A-Za-z]{3,60})",(?:I|input):/g)].map(m => m[1])); console.log('rpc methods', methods.length, methods.slice(0, 400).join(' '));
            for (const k of ['csrf', 'x-[a-z-]*token', 'new WebSocket\\(', 'Authorization', 'useWebSocket', 'SendUser', 'sendMessage', 'extensionView']) { const m = [...all.matchAll(new RegExp('.{90}' + k + '.{140}', 'gi'))].slice(0, 4).map(x => x[0].replace(/\s+/g, ' ')); console.log('--', k, m.length); for (const x of m) console.log('   ', x); }
          })();
          '@ | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'hub-probe.js')
          node (Join-Path $env:RUNNER_TEMP 'hub-probe.js')
      - name: agy CLI
        run: |
          $ErrorActionPreference = 'Continue'
          $agy = (Get-Command agy -ErrorAction SilentlyContinue).Source; if (-not $agy) { $agy = "$env:USERPROFILE\.gemini\bin\agy.exe" }
          "agy: $agy"
          foreach ($a in @('help', 'remote-control'), @('remote-control', 'status'), @('help', 'acp'), @('models'), @('agents')) { "== agy $($a -join ' ')"; & $agy @a 2>&1 | Select-Object -First 25 }
          "== agy -p (not signed in)"
          $j = Start-Job { param($agy, $w) Set-Location $w; 'say hi' | & $agy -p --output-format stream-json 2>&1 | Select-Object -First 25 } -ArgumentList $agy, (Join-Path $env:RUNNER_TEMP 'ag-work')
          Wait-Job $j -Timeout 40 | Out-Null; Receive-Job $j; Stop-Job $j -ErrorAction SilentlyContinue
          "== agy acp"
          @'
          const { spawn } = require('child_process');
          const c = spawn(process.argv[2], ['acp'], { cwd: process.argv[3], stdio: ['pipe', 'pipe', 'pipe'] });
          let buf = '';
          c.stdout.on('data', d => { buf += d; let i; while ((i = buf.indexOf('\n')) >= 0) { console.log('<-', buf.slice(0, i).slice(0, 1800)); buf = buf.slice(i + 1); } });
          c.stderr.on('data', d => console.log('stderr:', String(d).slice(0, 300)));
          const send = o => { console.log('->', JSON.stringify(o).slice(0, 200)); c.stdin.write(JSON.stringify(o) + '\n'); };
          send({ jsonrpc: '2.0', id: 1, method: 'initialize', params: { protocolVersion: 1, clientCapabilities: { fs: { readTextFile: false, writeTextFile: false }, terminal: false }, clientInfo: { name: 'agent-chat', version: '0' } } });
          setTimeout(() => send({ jsonrpc: '2.0', id: 2, method: 'session/list', params: {} }), 4000);
          setTimeout(() => send({ jsonrpc: '2.0', id: 3, method: 'session/new', params: { cwd: process.argv[3], mcpServers: [] } }), 7000);
          setTimeout(() => { c.kill(); process.exit(0); }, 16000);
          '@ | Out-File -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'acp-probe.js')
          node (Join-Path $env:RUNNER_TEMP 'acp-probe.js') $agy (Join-Path $env:RUNNER_TEMP 'ag-work')
