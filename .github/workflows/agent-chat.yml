name: agent-chat

# agent-chat 폴더가 바뀌면: 테스트(Windows · Linux) → Windows 설치 파일 · 안드로이드 앱 빌드 → Actions 의 Artifacts
# agent-chat-v0.2.0 같은 태그를 push 하면 Releases 에도 올린다
on:
  push:
    paths: ['agent-chat/**', '.github/workflows/agent-chat.yml']
    tags: ['agent-chat-v*']
  pull_request:
    paths: ['agent-chat/**', '.github/workflows/agent-chat.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        node: [18, 22]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: agent-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  windows-installer:
    needs: test
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: agent-chat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Bundle node.exe
        run: |
          $node = (Get-Command node).Source
          New-Item -ItemType Directory -Force runtime | Out-Null
          Copy-Item $node runtime\node.exe
          $lic = Join-Path (Split-Path $node) 'LICENSE'
          if (Test-Path $lic) { Copy-Item $lic runtime\NODE_LICENSE.txt }
          & runtime\node.exe --version
      - name: Install Inno Setup if missing
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build installer
        run: |
          $ver = (Get-Content package.json | ConvertFrom-Json).version
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$ver" windows\agent-chat.iss
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Get-ChildItem dist
      - name: Install silently and check the server
        run: |
          $setup = (Get-ChildItem dist\AgentChat-*-windows-setup.exe)[0].FullName
          Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/TASKS=firewall' -Wait
          $app = "${env:ProgramFiles}\Agent Chat"
          if (-not (Test-Path "$app\runtime\node.exe")) { throw "node.exe 가 설치되지 않음" }
          Start-Process wscript.exe -ArgumentList "`"$app\run-hidden.vbs`"" -Wait
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            try { $r = Invoke-WebRequest http://127.0.0.1:8790/ -UseBasicParsing; $ok = $r.StatusCode -eq 200 } catch { Start-Sleep -Milliseconds 500 }
          }
          if (-not $ok) { Get-Content "$env:USERPROFILE\.agent-chat\server.log" -ErrorAction SilentlyContinue; throw "서버가 안 켜짐" }
          Get-Content "$env:USERPROFILE\.agent-chat\server.log"
          $c = Invoke-WebRequest http://localhost:8790/connect -UseBasicParsing
          if ($c.StatusCode -ne 200) { throw "/connect 실패" }
          $info = Invoke-RestMethod http://localhost:8790/api/connect-info
          if (-not $info.urls) { throw "연결 주소 없음" }
          try { Invoke-WebRequest http://127.0.0.1:8790/api/sessions -UseBasicParsing; throw "토큰 없이 열림" } catch { if ($_.Exception.Response.StatusCode.value__ -ne 401) { throw $_ } }
          $rule = netsh advfirewall firewall show rule name="Agent Chat"
          if ($LASTEXITCODE -ne 0) { throw "방화벽 규칙 없음" }
          Start-Process wscript.exe -ArgumentList "`"$app\stop.vbs`" /quiet" -Wait
          Start-Sleep 1
          try { Invoke-WebRequest http://127.0.0.1:8790/ -UseBasicParsing -TimeoutSec 2; throw "서버가 안 꺼짐" } catch { if ($_.Exception.Message -eq "서버가 안 꺼짐") { throw $_ } }
          Start-Process "$app\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          Start-Sleep 2
          if (Test-Path "$app\server.js") { throw "제거 실패" }
      - uses: actions/upload-artifact@v4
        with:
          name: AgentChat-windows-setup
          path: agent-chat/dist/*.exe

  android:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      # 저장소 Secrets 에 서명 키가 있으면 그 키로 (ARARIFlex 와 같은 키를 써도 된다). 없으면 debug 키
      - name: Signing key
        env:
          KS: ${{ secrets.AGENT_CHAT_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 }}
          PW: ${{ secrets.AGENT_CHAT_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.AGENT_CHAT_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/release.p12"
            { echo "AC_KEYSTORE=$RUNNER_TEMP/release.p12"; echo "AC_KEYSTORE_PASSWORD=$PW"; echo "AC_KEY_ALIAS=${ALIAS:-mediashelf}"; } >> "$GITHUB_ENV"
            echo "정식 키로 서명합니다"
          else
            echo "::warning::서명 키 Secret 이 없어 debug 키로 서명합니다 (빌드마다 키가 달라 업데이트 설치가 안 될 수 있음)"
          fi
      - name: Build APK
        working-directory: agent-chat/android
        run: |
          export AC_VERSION_NAME=$(node -p "require('../package.json').version")
          export AC_VERSION_CODE=$GITHUB_RUN_NUMBER
          gradle --no-daemon assembleRelease
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/AgentChat-$AC_VERSION_NAME-android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AgentChat-android
          path: agent-chat/dist/*.apk

  release:
    if: startsWith(github.ref, 'refs/tags/agent-chat-v')
    needs: [windows-installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
