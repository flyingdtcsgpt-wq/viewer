<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111318">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Agent Chat</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="style.css">
<script src="app.js" defer></script>
</head>
<body>
<!-- 토큰 입력 -->
<section id="login" class="view" hidden>
  <div class="login-box">
    <h1>Agent Chat</h1>
    <p>PC 의 <b>Agent Chat 휴대폰 연결</b> 화면에 보이는 <b>연결 코드 6자리</b>를 넣으세요.</p>
    <input id="codeInput" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="연결 코드 (예: 482 913)">
    <button id="codeSave" class="primary">연결</button>
    <details><summary>토큰으로 접속</summary>
      <input id="tokenInput" type="password" autocomplete="off" placeholder="토큰">
      <button id="tokenSave">접속</button>
    </details>
    <p id="loginErr" class="err"></p>
  </div>
</section>

<!-- 세션 목록 -->
<section id="list" class="view" hidden>
  <header class="bar">
    <h1>대화</h1>
    <button id="pcBtn" class="chip" hidden>PC</button>
    <div class="chips" id="filters">
      <button data-f="all" class="chip on">전체</button>
      <button data-f="claude" class="chip">Claude</button>
      <button data-f="codex" class="chip">Codex</button>
    </div>
  </header>
  <div id="sessions" class="sessions"></div>
  <button id="newBtn" class="fab" aria-label="새 대화">＋</button>
</section>

<!-- 채팅 -->
<section id="chat" class="view" hidden>
  <header class="bar chatbar">
    <button id="back" class="icon" aria-label="뒤로">‹</button>
    <div class="titles">
      <div id="chatTitle" class="ttl"></div>
      <div id="chatSub" class="sub"></div>
    </div>
    <button id="authChip" class="authchip" hidden title="이 프로젝트를 구독(OAuth) / API 키 중 무엇으로 돌릴지">구독</button>
    <button id="toolsToggle" class="icon small" aria-label="도구 표시">⚙</button>
  </header>
  <div id="msgs" class="msgs"></div>
  <div id="status" class="status" hidden></div>
  <form id="composer" class="composer">
    <button id="optBtn" type="button" class="optbtn" aria-label="권한 · 모델 · 추론 설정"><span id="optSum">편집 허용</span></button>
    <select id="mode" aria-label="권한" hidden></select>
    <textarea id="input" rows="1" placeholder="메시지 보내기" enterkeyhint="send"></textarea>
    <button id="sendBtn" class="send" type="submit" aria-label="보내기">➤</button>
  </form>
</section>

<!-- 새 대화 -->
<div id="sheet" class="sheet" hidden>
  <form id="newForm" class="sheet-box">
    <h2>새 대화</h2>
    <div class="seg" id="newAgent">
      <button type="button" data-a="claude" class="on">Claude</button>
      <button type="button" data-a="codex">Codex</button>
    </div>
    <label>작업 폴더
      <select id="newProject"></select>
    </label>
    <input id="newPath" placeholder="또는 폴더 경로 직접 입력">
    <label>실행 방식 (이 프로젝트)
      <select id="newAuth">
        <option value="sub">구독 (OAuth 로그인)</option>
        <option value="api">API 키</option>
      </select>
    </label>
    <label>권한 <select id="newMode"></select></label>
    <button type="button" id="newOptBtn" class="optline">모델 · 추론: <b id="newOptSum">기본</b> <span>바꾸기</span></button>
    <textarea id="newPrompt" rows="4" placeholder="무엇을 시킬까요?"></textarea>
    <p id="newErr" class="err"></p>
    <div class="row">
      <button type="button" id="newCancel">취소</button>
      <button type="submit" class="primary">시작</button>
    </div>
  </form>
</div>
<!-- 남은 사용량 (목록 · 대화 화면 맨 아래에 붙는다) -->
<button id="usageBar" type="button" class="usagebar" aria-label="남은 사용량 (누르면 초기화 시각)"><span id="usageLine">사용량 불러오는 중…</span><span id="usageMore" class="usagemore" hidden></span></button>

<!-- 보낼 때 설정: 권한 · 모델 · 추론 강도 · 생각 -->
<div id="optSheet" class="sheet" hidden>
  <form id="optForm" class="sheet-box">
    <h2 id="optTitle">보낼 때 설정</h2>
    <label id="optModeRow">권한 <select id="optMode"></select></label>
    <label>모델
      <select id="optModel"></select>
    </label>
    <input id="optModelCustom" placeholder="모델 이름 직접 입력 (예: claude-opus-5-5, gpt-6.1-sol)" hidden>
    <label>추론 강도 (effort)
      <select id="optEffort"></select>
    </label>
    <label id="optThinkRow">생각 (thinking)
      <select id="optThinking">
        <option value="">기본 (PC 설정)</option>
        <option value="on">켜기</option>
        <option value="off">끄기</option>
      </select>
    </label>
    <p id="optNow" class="optnow"></p>
    <p class="optnow">고른 값은 이 휴대폰에 기억되고, 보내는 메시지마다 적용됩니다. "기본"은 PC 의 Claude · Codex 설정을 그대로 씁니다.</p>
    <div class="row">
      <button type="button" id="optReset">모두 기본으로</button>
      <button type="submit" class="primary">완료</button>
    </div>
  </form>
</div>
</body>
</html>
